<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silver Knight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 40px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }
    .subtitle {
      font-size: 13px;
      color: #8888aa;
      margin-bottom: 32px;
    }
    .status-area {
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(102, 126, 234, 0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 13px;
      color: #aaaacc;
    }
    .status-text.error {
      color: #ff6b6b;
    }
    .status-text.success {
      color: #51cf66;
    }
    .progress-bar {
      width: 200px;
      height: 3px;
      background: rgba(102, 126, 234, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .retry-btn {
      -webkit-app-region: no-drag;
      margin-top: 8px;
      padding: 8px 24px;
      background: rgba(102, 126, 234, 0.15);
      color: #667eea;
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: rgba(102, 126, 234, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">SK</div>
    <h1>Silver Knight</h1>
    <p class="subtitle">Sistema de Facturaci&oacute;n Fiscal</p>
    <div class="status-area" id="status-area">
      <div class="spinner" id="spinner"></div>
      <p class="status-text" id="status-text">Iniciando...</p>
      <div class="progress-bar" id="progress-bar" style="display:none">
        <div class="fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
  </div>
  <script>
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const statusArea = document.getElementById('status-area');

    function setStatus(text, type) {
      statusText.textContent = text;
      statusText.className = 'status-text' + (type ? ' ' + type : '');
    }

    function showProgress(percent) {
      progressBar.style.display = 'block';
      progressFill.style.width = percent + '%';
    }

    function hideProgress() {
      progressBar.style.display = 'none';
    }

    function showError(text) {
      setStatus(text, 'error');
      spinner.style.display = 'none';
      hideProgress();
      const existing = document.querySelector('.retry-btn');
      if (!existing) {
        const btn = document.createElement('button');
        btn.className = 'retry-btn';
        btn.textContent = 'Reintentar';
        btn.onclick = function() { window.electron?.send('splash-retry'); };
        statusArea.appendChild(btn);
      }
    }

    if (window.electron) {
      window.electron.on('splash-status', function(msg) {
        setStatus(msg, '');
        spinner.style.display = '';
        const btn = document.querySelector('.retry-btn');
        if (btn) btn.remove();
      });
      window.electron.on('splash-progress', function(percent) {
        showProgress(percent);
      });
      window.electron.on('splash-error', function(msg) {
        showError(msg);
      });
      window.electron.on('splash-success', function(msg) {
        setStatus(msg, 'success');
        spinner.style.display = '';
        hideProgress();
      });
    }
  </script>
</body>
</html>

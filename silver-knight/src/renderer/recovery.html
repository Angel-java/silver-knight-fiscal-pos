<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silver Knight — Recuperación</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        padding: 32px;
        user-select: none;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 24px;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .card h2 {
        font-size: 14px;
        font-weight: 600;
        color: #f8fafc;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .row .label {
        color: #94a3b8;
      }
      .row .value {
        color: #e2e8f0;
        word-break: break-all;
        text-align: right;
      }
      button {
        -webkit-app-region: no-drag;
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 8px;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      button:hover:not(:disabled) {
        background: #1e293b;
        border-color: #64748b;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.primary {
        background: #6366f1;
        border-color: #6366f1;
        color: #fff;
        font-weight: 600;
      }
      button.primary:hover:not(:disabled) {
        background: #4f46e5;
      }
      button.danger {
        background: #7f1d1d;
        border-color: #7f1d1d;
        color: #fff;
      }
      button.danger:hover:not(:disabled) {
        background: #991b1b;
      }
      #status {
        font-size: 13px;
        color: #94a3b8;
        min-height: 18px;
        margin-top: 8px;
      }
      #status.error {
        color: #f87171;
      }
      #status.ok {
        color: #4ade80;
      }
      .instList {
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <h1>Silver Knight</h1>
    <p class="subtitle">
      M&oacute;dulo de recuperaci&oacute;n — la aplicaci&oacute;n no pudo iniciarse normalmente
    </p>

    <div class="card">
      <h2>Diagn&oacute;stico</h2>
      <div class="row">
        <span class="label">Versi&oacute;n instalada</span><span class="value" id="ver">—</span>
      </div>
      <div class="row">
        <span class="label">Motivo del fallo</span><span class="value" id="reason">—</span>
      </div>
      <div class="row">
        <span class="label">Reintentos consecutivos</span><span class="value" id="failures">—</span>
      </div>
      <div class="row">
        <span class="label">Actualizaci&oacute;n pendiente</span
        ><span class="value" id="pending">—</span>
      </div>
    </div>

    <div class="card">
      <h2>Acciones</h2>
      <button class="primary" id="btn-install-cached">
        Reinstalar versi&oacute;n en cach&eacute;
      </button>
      <button id="btn-install-offline">Instalar paquete desde USB (C:\SilverKnightUpdates)</button>
      <button id="btn-apply-update">Aplicar actualizaci&oacute;n descargada</button>
      <button id="btn-relaunch">Reintentar arranque</button>
      <button id="btn-copy">Copiar diagn&oacute;stico</button>
      <button class="danger" id="btn-quit">Salir</button>
      <p id="status"></p>
    </div>

    <script>
      const $ = (id) => document.getElementById(id)
      const statusEl = $('status')

      function setStatus(text, type) {
        statusEl.textContent = text
        statusEl.className = type ? type : ''
      }

      const api = window.api
      const both = async (fn) => {
        try {
          return await fn()
        } catch (err) {
          return { ok: false, error: String(err) }
        }
      }

      async function refresh() {
        try {
          const info = await api.recovery.getInfo()
          $('ver').textContent = info.appVersion || '—'
          $('reason').textContent = info.reason || '—'
          const bs = info.bootState || {}
          $('failures').textContent =
            String(bs.consecutiveFailures ?? 0) +
            ' (tras update: ' +
            (bs.failuresAfterUpdate ?? 0) +
            ')'
          $('pending').textContent = bs.pendingUpgrade || 'ninguna'
          const offline = info.offlineInstaller
          $('btn-install-offline').disabled = !offline
          $('btn-install-offline').textContent = offline
            ? 'Instalar paquete USB v' + offline.version
            : 'Instalar paquete desde USB (no detectado)'
        } catch (err) {
          setStatus('No se pudo leer el estado: ' + err, 'error')
        }
      }

      async function runCmd(action, okText, errPrefix) {
        setStatus('Procesando...', '')
        const res = await both(action)
        if (res.ok) setStatus(okText + (res.version ? ' (' + res.version + ')' : ''), 'ok')
        else setStatus(errPrefix + ': ' + (res.error || 'error desconocido'), 'error')
        return res
      }

      function wire() {
        $('btn-install-cached').onclick = () =>
          runCmd(
            () => api.recovery.installCached(),
            'Instalador lanzado, la aplicaci&oacute;n se cerrar&aacute; y el instalador la relanzar&aacute;',
            'No se pudo instalar desde cach&eacute;'
          )
        $('btn-install-offline').onclick = () =>
          runCmd(
            () => api.recovery.installOffline(),
            'Instalaci&oacute;n USB lanzada, la aplicaci&oacute;n se cerrar&aacute; y el instalador la relanzar&aacute;',
            'No se pudo instalar desde USB'
          )
        $('btn-apply-update').onclick = () =>
          runCmd(
            () => api.recovery.applyUpdate(),
            'Actualizaci&oacute;n en camino',
            'No se pudo aplicar la actualizaci&oacute;n'
          )
        $('btn-relaunch').onclick = () => {
          setStatus('Reintentando...', '')
          api.recovery.relaunch()
        }
        $('btn-copy').onclick = async () => {
          const res = await both(() => api.recovery.copyDiagnostics())
          if (res.ok) setStatus('Diagn&oacute;stico copiado al portapapeles.', 'ok')
          else setStatus('No se pudo copiar el diagn&oacute;stico.', 'error')
        }
        $('btn-quit').onclick = () => api.recovery.quit()
      }

      if (api && api.recovery) {
        wire()
        refresh()
      } else {
        setStatus('Preload de recuperaci&oacute;n no disponible.', 'error')
      }
    </script>
  </body>
</html>

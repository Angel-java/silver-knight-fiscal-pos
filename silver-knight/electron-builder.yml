appId: com.silverknight.pos
productName: Silver Knight
directories:
  buildResources: build
afterPack: ./scripts/afterPack.js
asar: false
files:
  - package.json
  - "**/*"
  - "!**/.vscode/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!**/node_modules/**/{test,__tests__,tests}/**"
  - "!**/*.{map}"
  - "!**/__tests__/**"
extraResources:
  - from: docker-compose.yml
    to: docker-compose.yml
  - from: Dockerfile
    to: Dockerfile
  - from: docker-entrypoint.sh
    to: docker-entrypoint.sh
  - from: src/server
    to: src/server
  - from: server/package.json
    to: server/package.json
  - from: server/package-lock.json
    to: server/package-lock.json
  - from: prisma
    to: prisma
  - from: prisma/schema.prisma
    to: prisma/schema.prisma
  - from: package.json
    to: package.json
  - from: package-lock.json
    to: package-lock.json
  - from: tsconfig.json
    to: tsconfig.json
  - from: tsconfig.node.json
    to: tsconfig.node.json
  - from: ../opencode-tools/reset-root/reset-root.js
    to: reset-root/reset-root.js
win:
  executableName: SilverKnight
  target:
    target: nsis
    arch: x64
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Silver Knight
  artifactName: ${name}-${version}-setup.${ext}
  uninstallDisplayName: ${productName}
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  menuCategory: Silver Knight
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: Angel-java
  repo: silver-knight-fiscal-pos

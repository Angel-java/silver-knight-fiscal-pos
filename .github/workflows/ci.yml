name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: silver-knight/package-lock.json

      - run: npm ci
        working-directory: silver-knight

      - run: npx prisma generate
        working-directory: silver-knight

      - run: npm run lint
        working-directory: silver-knight

      - run: npm run typecheck
        working-directory: silver-knight

      - run: npm test
        working-directory: silver-knight

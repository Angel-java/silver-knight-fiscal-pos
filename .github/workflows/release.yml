name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: silver-knight/package-lock.json

      - name: Install dependencies
        working-directory: silver-knight
        run: npm ci

      - name: Generate Prisma client
        working-directory: silver-knight
        run: npx prisma generate

      - name: Build app
        working-directory: silver-knight
        run: npm run build

      - name: Build and Publish
        working-directory: silver-knight
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder creates the release as draft and does not set the
      # "Latest" flag, which makes the auto-updater miss it. Also, uploads
      # may race with release creation and get lost.
      # This step publishes the release, marks it as latest and re-uploads
      # all required artifacts so auto-updates keep working.
      - name: Finalize release (publish + latest + artifacts)
        shell: bash
        working-directory: silver-knight
        run: |
          REF=${{ github.ref_name }}
          gh release edit "$REF" --draft=false --latest
          for f in dist/*.exe dist/*.blockmap dist/latest.yml; do
            if [ -f "$f" ]; then
              echo "Uploading $f"
              gh release upload "$REF" "$f" --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

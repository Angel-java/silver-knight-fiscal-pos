name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: silver-knight/package-lock.json

      - name: Install dependencies
        working-directory: silver-knight
        run: npm ci

      - name: Generate Prisma client
        working-directory: silver-knight
        run: npx prisma generate

      - name: Build app
        working-directory: silver-knight
        run: npm run build

      - name: Build and Publish
        working-directory: silver-knight
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder creates the release as draft and does not set the
      # "Latest" flag, which makes the auto-updater miss it. Also, the
      # .blockmap is uploaded before the release exists and gets lost.
      # This step publishes the release, marks it as latest and re-uploads
      # the blockmap so differential updates keep working.
      - name: Finalize release (publish + latest + blockmap)
        shell: bash
        working-directory: silver-knight
        run: |
          REF=${{ github.ref_name }}
          gh release edit "$REF" --draft=false --latest
          if ls dist/*.blockmap >/dev/null 2>&1; then
            gh release upload "$REF" dist/*.blockmap --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: silver-knight/package-lock.json

      - name: Install dependencies
        working-directory: silver-knight
        run: npm ci

      - name: Generate Prisma client
        working-directory: silver-knight
        run: npx prisma generate

      - name: Build app
        working-directory: silver-knight
        run: npm run build

      - name: Package installer (no publish)
        working-directory: silver-knight
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload artifacts
        shell: bash
        working-directory: silver-knight
        run: |
          REF=${{ github.ref_name }}
          # Delete existing release if any (allows safe re-runs)
          gh release delete "$REF" --yes --cleanup-tag 2>/dev/null || true
          # Create release with all artifacts
          gh release create "$REF" \
            dist/*.exe dist/*.blockmap dist/latest.yml \
            --title "Silver Knight $REF" \
            --generate-notes \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

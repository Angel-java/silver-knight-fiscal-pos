name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: silver-knight/package-lock.json

      - name: Install dependencies
        working-directory: silver-knight
        run: npm ci

      - name: Generate Prisma client
        working-directory: silver-knight
        run: npx prisma generate

      - name: Lint
        working-directory: silver-knight
        run: npm run lint

      - name: Typecheck
        working-directory: silver-knight
        run: npm run typecheck

      - name: Build and Package
        working-directory: silver-knight
        run: npm run build:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: silver-knight-windows-setup
          path: silver-knight/dist/*.exe
          retention-days: 30
